name: Pocket
options:
  bundleIdPrefix: com.jonghdch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: HY2BBK27N4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Pocket:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PocketWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonghdch.pocket
        PRODUCT_NAME: POCKET
    entitlements:
      path: App/Pocket.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jonghdch.pocket]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: POCKET
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 말로 할 일과 메모를 입력하려면 마이크가 필요해요.
        NSSpeechRecognitionUsageDescription: 말한 내용을 글자로 바꾸려면 음성 인식이 필요해요.
        NSCalendarsFullAccessUsageDescription: 일정을 iOS 캘린더에 넣고 고치려면 캘린더 권한이 필요해요.
        CFBundleURLTypes:
          - CFBundleURLName: com.jonghdch.pocket
            CFBundleURLSchemes: [pocket]
  PocketWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonghdch.pocket.widget
        PRODUCT_NAME: PocketWidget
    entitlements:
      path: Widget/PocketWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jonghdch.pocket]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: POCKET
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PocketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Pocket
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/POCKET.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/POCKET
        PRODUCT_BUNDLE_IDENTIFIER: com.jonghdch.pocket.tests
  PocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pocket
    settings:
      base:
        TEST_TARGET_NAME: Pocket
        PRODUCT_BUNDLE_IDENTIFIER: com.jonghdch.pocket.uitests
schemes:
  Pocket:
    build:
      targets:
        Pocket: all
        PocketWidget: all
    test:
      targets: [PocketTests, PocketUITests]
